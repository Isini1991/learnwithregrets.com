name: Auto-Sync Bandcamp Discography

on:
  schedule:
    # Run every 2 hours (00:15, 02:15, 04:15, ... UTC)
    - cron: '15 */2 * * *'
  workflow_dispatch:

concurrency:
  group: bandcamp-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Bandcamp sync engine
        run: |
          python scripts/sync_bandcamp.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected! Staging, committing and pushing..."
            git add assets/ data.json data.js index.html app.js .github/
            git commit -m "Auto-sync Bandcamp discography [skip ci]"
            git push origin main
          else
            echo "No changes found. Everything is up-to-date."
          fi
